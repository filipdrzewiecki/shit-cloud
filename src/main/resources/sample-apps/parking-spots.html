<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Miejsca parkingowe</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; color: #1f2328; }
  h1 { font-size: 20px; }
  .spots { display: grid; grid-template-columns: repeat(4, 110px); gap: 10px; }
  .spot { border: 2px solid #d0d7de; border-radius: 8px; padding: 12px; cursor: pointer; text-align: center; }
  .spot.taken { border-color: #cf222e; background: #ffebe9; }
  .spot b { display: block; font-size: 18px; }
  small { color: #656d76; }
</style>
</head>
<body>
<h1>Parking — jutro</h1>
<div class="spots" id="spots"></div>
<p><small>Kliknij wolne miejsce, żeby je zarezerwować na siebie.</small></p>
<script>
  const taken = { P1: 'Tomek', P4: 'Anna' };
  const el = document.getElementById('spots');
  function render() {
    el.innerHTML = ['P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'P7', 'P8'].map(s =>
      `<div class="spot ${taken[s] ? 'taken' : ''}" data-s="${s}"><b>${s}</b>${taken[s] || 'wolne'}</div>`).join('');
  }
  el.addEventListener('click', e => {
    const s = e.target.closest('.spot')?.dataset.s;
    if (!s) return;
    if (taken[s] === 'Ja') delete taken[s]; else if (!taken[s]) taken[s] = 'Ja';
    render();
  });
  render();
</script>
</body>
</html>
