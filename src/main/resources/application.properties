spring.application.name=shit-cloud
server.port=${PORT:8080}
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true

# Comma-separated origins of the GUI. On Railway set CORS_ALLOWED_ORIGINS to the frontend service's domain.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

#====== DATABASE — PostgreSQL; the schema comes from Flyway migrations in db/migration.
# No defaults on purpose: a deploy without them must fail at startup, not quietly try localhost.
spring.datasource.url=${DATABASE_JDBC_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

#====== APPS
# Earlier versions of an app are kept this long (removed nightly by ExpiryJob).
apps.version-ttl=90d
apps.max-html-size=5MB
# Sample apps on an empty database. Only the dev profile turns it on.
apps.seed-samples=false

#====== APP DATA — the documents of all apps live in `docs`, their earlier states in `doc_history`.
data.history-ttl=90d
data.max-doc-size=256KB
data.max-results=1000
# One app's data download is built in memory; bigger apps get a clear 413 instead of a stalled server.
data.max-export-documents=100000

#====== APPS ORIGIN — app documents and the library mirror are served on their own port, which gets its own
# public domain. {slug} in the host = one origin per app; {slug} in the path = one shared apps origin.
apps.port=${APPS_PORT:8081}
# No default on purpose: a deploy without it must not hand out frame URLs pointing nowhere.
apps.url-pattern=${APPS_URL_PATTERN}

#====== AUTH — builders and admins sign in through the identity provider (Auth0 now, ADFS / Entra ID
# on-prem). Public values: validating a token needs no secret.
auth.issuer-uri=${AUTH_ISSUER_URI:https://my-intelligence.eu.auth0.com/}
auth.audience=${AUTH_AUDIENCE:https://shit-cloud-api}
auth.jwks-uri=${AUTH_JWKS_URI:https://my-intelligence.eu.auth0.com/.well-known/jwks.json}
# Which claims carry identity and groups. On ADFS / Entra ID these become e.g. email or upn, and groups.
auth.id-claim=${AUTH_ID_CLAIM:https://shit-cloud-api/email}
auth.name-claim=${AUTH_NAME_CLAIM:https://shit-cloud-api/name}
auth.groups-claim=${AUTH_GROUPS_CLAIM:https://shit-cloud-api/groups}
auth.builders-group=${BUILDERS_GROUP:ShitCloud Builder}
auth.admins-group=${ADMINS_GROUP:ShitCloud Admin}

#====== AUTH — everyone else signs in with a shared password. No password set = guest sign-in is off.
auth.guest.password=${GUEST_PASSWORD:}
# Signs guest tokens; at least 32 bytes. Separate from the password so a token cannot be used to crack it.
auth.guest.token-secret=${GUEST_TOKEN_SECRET:}
auth.guest.token-ttl=1d
auth.guest.max-failures=10
auth.guest.failure-window=15m

#====== BUILD CHAT — Claude through Spring AI, billed per token on one key. No key = the app starts, the chat
# answers 503 until ANTHROPIC_API_KEY is set.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=${CHAT_MODEL:claude-sonnet-5-5}
# A whole app of a few hundred lines is ~10-15k output tokens.
chat.max-tokens=${CHAT_MAX_TOKENS:32000}
# One step = one model call; a tool call starts the next one.
chat.max-steps=5
# Messages of the conversation resent to the model; only the latest draft's HTML goes with them.
chat.history-messages=20
# Comment lines that keep proxies from closing a stream while the model writes a long tool input.
chat.ping-interval=15s
# Writing a whole app takes up to a few minutes; the stream must outlive it.
spring.mvc.async.request-timeout=10m
# The Anthropic client's own limit on one model call, streaming included (Spring AI default 60 s). A longer answer
# was cut off with "Stream failed" — rewriting a large app streams its whole HTML into save_draft.
spring.ai.anthropic.timeout=10m
