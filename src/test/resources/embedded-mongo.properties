# Embedded mongod for local development and integration tests (loaded by EmbeddedMongoConfig).
# Satisfies the ${MONGODB_URI} placeholder; the embedded auto-configuration then replaces host and port
# with the ones of the mongod it started and keeps the database name.
MONGODB_URI=mongodb://localhost/shitcloud
# Same major version as the Railway mongo service (template image mongo:7).
de.flapdoodle.mongodb.embedded.version=7.0.14
# A replica set, as on Railway, so multi-document transactions work locally too.
de.flapdoodle.mongodb.embedded.storage.repl-set-name=rs0
